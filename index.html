<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1413">
<title>Merchant Ops</title>
<meta name="description" content="Merchant Ops staff sign in">
<style>
  :root{
    --bg:#0d1413; --card:#1a2220; --field:#101615; --ink:#e9f1ee; --muted:#b4c0bc;
    --line:#8a9a95; --brand:#6dcfb8; --brand-ink:#0d1413; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
  main{width:100%;max-width:380px;text-align:center}
  .logo{width:88px;height:88px;margin:0 auto 16px;border-radius:24px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:44px;font-weight:800;box-shadow:0 0 40px rgba(109,207,184,.25)}
  h1{margin:0 0 6px;font-size:1.9rem;letter-spacing:-.01em}
  .sub{margin:0 0 22px;color:var(--muted)}
  .card{background:var(--card);border:1px solid #243230;border-radius:24px;padding:18px;text-align:left}
  label{display:block;font-weight:700;font-size:.95rem;margin:2px 0 8px}
  input{width:100%;height:54px;padding:0 16px;margin-bottom:18px;background:var(--field);color:var(--ink);border:2px solid var(--line);border-radius:14px;font:inherit}
  input::placeholder{color:#7d8b87}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,207,184,.25)}
  button,.btn{display:block;width:100%;height:58px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;margin-top:4px;text-align:center;line-height:58px;text-decoration:none}
  button:hover,.btn:hover{filter:brightness(1.05)}
  button:disabled{opacity:.6;cursor:wait}
  button.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand);line-height:54px;margin-top:10px}
  .link{display:block;text-align:center;margin-top:18px;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px;background:none;border:0;height:auto;line-height:1.4;font-size:1rem;width:100%}
  .msg{display:none;margin:16px 0 0;padding:10px 12px;border-radius:12px;background:#3a2d10;color:var(--warn);font-size:.9rem;text-align:left}
  .msg.show{display:block}
  .msg.ok{background:#123a36;color:var(--brand)}
  .msg a{color:inherit;font-weight:700}
  .hidden{display:none}
  .who{font-size:1.25rem;font-weight:800;margin:4px 0 2px}
  .role{color:var(--muted);margin:0 0 14px;text-transform:capitalize}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">M</div>
  <h1>Merchant Ops</h1>
  <p class="sub" id="sub">Sign in with your Staff ID and PIN.</p>

  <form id="login" class="card" autocomplete="on" novalidate>
    <label for="staff">Staff ID</label>
    <input id="staff" name="staff" autocomplete="username" autocapitalize="off" placeholder="Staff ID">

    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4-8 digit PIN">

    <button type="submit" id="go">Sign in</button>
    <button type="button" class="link" id="toRequest">New staff? Request access</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <form id="request" class="card hidden" autocomplete="off" novalidate>
    <label for="rid">Staff ID</label>
    <input id="rid" autocapitalize="off" placeholder="Choose your Staff ID">
    <label for="rname">Your name</label>
    <input id="rname" placeholder="Full name">
    <label for="rpin">PIN</label>
    <input id="rpin" type="password" inputmode="numeric" placeholder="Choose a 4-8 digit PIN">
    <button type="submit" id="rgo">Send request</button>
    <button type="button" class="link" id="toLogin">Back to sign in</button>
    <p class="msg" id="rmsg" role="status"></p>
  </form>

  <section id="home" class="card hidden">
    <p class="who" id="who"></p>
    <p class="role" id="role"></p>
    <a class="btn" id="open" href="#">Open the full app</a>
    <button type="button" class="ghost" id="out">Sign out</button>
  </section>
</main>

<script>
(function(){
  var APP = 'https://script.google.com/macros/s/AKfycbzl5Acg7vrAUt7LsTjLgZhZrO8-Kfn3wR66PJoi6wel4snX-RGfkPh12QxlrCYMy7FiPw/exec';
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'mo_session';

  function say(el, text, ok){ el.innerHTML = text; el.className = 'msg show' + (ok ? ' ok' : ''); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var fallback = 'Sign-in service is not available yet. <a href="' + APP + '">Open the live app</a> to sign in.';

  // text/plain body keeps this a simple CORS request (no preflight).
  function call(action, args){
    return fetch(APP, { method:'POST', body: JSON.stringify({ action: action, args: args }) })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j; try { j = JSON.parse(t); } catch(e){ throw new Error('__noapi'); }
        if (!j.ok) throw new Error(j.error || 'Something went wrong.');
        return j.data;
      });
  }
  function fail(el, err){
    say(el, err && err.message === '__noapi' || err instanceof TypeError ? fallback : esc(err.message));
  }

  function showHome(user){
    $('login').classList.add('hidden'); $('request').classList.add('hidden'); $('home').classList.remove('hidden');
    $('sub').textContent = 'You are signed in.';
    $('who').textContent = (user && (user.name || user.staffId)) || 'Signed in';
    $('role').textContent = (user && user.role) || '';
    $('open').href = APP;
  }
  function showLogin(){
    $('home').classList.add('hidden'); $('request').classList.add('hidden'); $('login').classList.remove('hidden');
    $('sub').textContent = 'Sign in with your Staff ID and PIN.';
  }

  $('login').addEventListener('submit', function(e){
    e.preventDefault();
    var id = $('staff').value.trim(), pin = $('pin').value.trim();
    if (!id || !pin) { say($('msg'), 'Enter your Staff ID and PIN.'); return; }
    var b = $('go'); b.disabled = true; b.textContent = 'Signing in...';
    call('login', [id, pin]).then(function(d){
      try { sessionStorage.setItem(KEY, d.token); } catch(e){}
      $('pin').value = ''; $('msg').className = 'msg';
      showHome(d.user);
    }).catch(function(err){ fail($('msg'), err); })
      .then(function(){ b.disabled = false; b.textContent = 'Sign in'; });
  });

  $('toRequest').addEventListener('click', function(){ $('login').classList.add('hidden'); $('request').classList.remove('hidden'); $('sub').textContent = 'Request access from your manager.'; });
  $('toLogin').addEventListener('click', showLogin);

  $('request').addEventListener('submit', function(e){
    e.preventDefault();
    var id = $('rid').value.trim(), name = $('rname').value.trim(), pin = $('rpin').value.trim();
    var b = $('rgo'); b.disabled = true; b.textContent = 'Sending...';
    call('requestAccess', [id, name, pin]).then(function(){
      say($('rmsg'), 'Request sent. Your manager will review it.', true);
      $('rpin').value = '';
    }).catch(function(err){ fail($('rmsg'), err); })
      .then(function(){ b.disabled = false; b.textContent = 'Send request'; });
  });

  $('out').addEventListener('click', function(){
    var t = null; try { t = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); } catch(e){}
    if (t) call('logout', [t]).catch(function(){});
    showLogin();
  });

  // Restore a session after reload.
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch(e){}
  if (saved) call('session', [saved]).then(function(d){ showHome(d.user); }).catch(function(){ try { sessionStorage.removeItem(KEY); } catch(e){} });
})();
</script>
</body>
</html>
