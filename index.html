<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1413">
<title>Merchant Ops</title>
<meta name="description" content="Merchant Ops staff sign in">
<style>
  :root{
    --bg:#0d1413; --card:#1a2220; --field:#101615; --ink:#e9f1ee; --muted:#b4c0bc;
    --line:#8a9a95; --brand:#6dcfb8; --brand-ink:#0d1413; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
  main{width:100%;max-width:380px;text-align:center}
  .logo{width:88px;height:88px;margin:0 auto 16px;border-radius:24px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:44px;font-weight:800;box-shadow:0 0 40px rgba(109,207,184,.25)}
  h1{margin:0 0 6px;font-size:1.9rem;letter-spacing:-.01em}
  .sub{margin:0 0 22px;color:var(--muted)}
  form{background:var(--card);border:1px solid #243230;border-radius:24px;padding:18px;text-align:left}
  label{display:block;font-weight:700;font-size:.95rem;margin:2px 0 8px}
  input{width:100%;height:54px;padding:0 16px;margin-bottom:18px;background:var(--field);color:var(--ink);border:2px solid var(--line);border-radius:14px;font:inherit}
  input::placeholder{color:#7d8b87}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,207,184,.25)}
  button{width:100%;height:58px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;margin-top:4px}
  button:hover{filter:brightness(1.05)}
  button:active{transform:translateY(1px)}
  .request{display:block;text-align:center;margin-top:18px;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}
  .msg{display:none;margin:16px 0 0;padding:10px 12px;border-radius:12px;background:#3a2d10;color:var(--warn);font-size:.9rem;text-align:left}
  .msg.show{display:block}
  .msg a{color:inherit;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">M</div>
  <h1>Merchant Ops</h1>
  <p class="sub">Sign in with your Staff ID and PIN.</p>

  <form id="login" autocomplete="on" novalidate>
    <label for="staff">Staff ID</label>
    <input id="staff" name="staff" inputmode="numeric" autocomplete="username" placeholder="Staff ID">

    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4-8 digit PIN">

    <button type="submit">Sign in</button>
    <a class="request" href="#" id="request">New staff? Request access</a>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>

<script>
  var msg = document.getElementById('msg');
  var APP = 'https://script.google.com/macros/s/AKfycbzl5Acg7vrAUt7LsTjLgZhZrO8-Kfn3wR66PJoi6wel4snX-RGfkPh12QxlrCYMy7FiPw/exec';
  function show(t){ msg.innerHTML = t; msg.className = 'msg show'; }
  document.getElementById('login').addEventListener('submit', function(e){
    e.preventDefault();
    var id = this.staff.value.trim(), pin = this.pin.value.trim();
    if(!id){ show('Enter your Staff ID.'); return; }
    if(!/^\d{4,8}$/.test(pin)){ show('PIN must be 4-8 digits.'); return; }
    show('This page is the sign-in screen only. <a href="' + APP + '">Open the live app</a> to sign in.');
  });
  document.getElementById('request').addEventListener('click', function(e){
    e.preventDefault();
    show('Ask your manager to add you, then <a href="' + APP + '">open the live app</a>.');
  });
</script>
</body>
</html>
